[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skilly-ai"
version = "1.0.5"
description = "Autonomous LLM-free project capability analyzer and interactive knowledge graph synthesizer."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Skilly Contributors" }]
maintainers = [{ name = "Skilly Contributors" }]
keywords = ["ast", "knowledge-graph", "static-analysis", "skills", "capabilities", "documentation", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "networkx>=2.8",
    "rich>=12.0.0",
]

[project.urls]
Homepage = "https://github.com/arastuthakur/skilly#readme"
PyPI = "https://pypi.org/project/skilly-ai/"
Repository = "https://github.com/arastuthakur/skilly"
Documentation = "https://github.com/arastuthakur/skilly#readme"
Issues = "https://github.com/arastuthakur/skilly/issues"

[project.optional-dependencies]
treesitter = [
    "tree-sitter>=0.20.0",
    "tree-sitter-languages",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
skilly = "skilly_core.cli:main"

[tool.setuptools.packages.find]
include = ["skilly_core*"]
